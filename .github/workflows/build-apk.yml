name: Build Android APK (Mafia eSports)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release Mafia eSports APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web bundle
        run: npm run build

      - name: Initialize & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android app icon & permissions
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp public/pwa-512x512.png "$dir/ic_launcher.png"
                cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
                cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK output
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Mafia-eSports.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mafia-eSports-APK
          path: apk-output/Mafia-eSports.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mafia eSports Android APK (Latest)
          body: |
            Automated Android APK build for **Mafia eSports** (`com.mafiaesports.app`).
            Download `Mafia-eSports.apk` below and install directly on Android.
          files: apk-output/Mafia-eSports.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
